user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name www.qaz5678.xyz;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            default_type text/plain;
        }

        location / { return 301 https://www.qaz5678.xyz$request_uri; }
    }

    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name www.qaz5678.xyz;
        root /var/www/free-ai-directory;
        index index.html;

        ssl_certificate /etc/letsencrypt/live/www.qaz5678.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.qaz5678.xyz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"ok":true,"service":"free-ai-directory","static":true}';
        }

        # Keep the static Nginx release compatible with the Worker health URL
        # documented for local and Cloudflare deployments.
        location = /api/health {
            access_log off;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"ok":true,"service":"free-ai-directory","static":true}';
        }

        location = /event {
            access_log /var/log/nginx/events.log main;
            add_header Cache-Control "no-store" always;
            return 204;
        }

        location = /xhs {
            return 302 /videos/codex-build-ai-daily-site/?utm_source=xiaohongshu&utm_medium=video&utm_campaign=codex_daily;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / { try_files $uri $uri/ =404; }
        error_page 404 /404.html;
        location = /404.html { internal; }
    }
}
