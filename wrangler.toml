name = "free-ai-directory"
main = "src/static-worker.ts"
compatibility_date = "2026-07-24"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = [ "/api/health" ]
html_handling = "force-trailing-slash"
not_found_handling = "404-page"

[vars]
RELEASE = "1.0.0"

[observability]
enabled = true
head_sampling_rate = 0.05
